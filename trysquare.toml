# Machine paths of the workbench, and nothing else.
#
# This file exists for one reason: a scenario names a repository by a logical name, and only a
# config file can say what that name points at on this machine. `scenarios/issue1-context.toml`
# writes `repo = "neon"` and a harness brick writes `repo = "websearch"`, so without these two
# tables a run refuses before it starts.
#
# Everything else trysquare would accept here is left out on purpose, because the values this
# experiment wants are already the built-in ones: `workdir` defaults to `$TMPDIR/trysquare` and
# falls back to the system temporary directory when `$TMPDIR` is unset, `concurrency` to 5,
# `timeout` to 900, `attempts` to 3, `draws` to 10000 and `seed` to 20260729. The scenario sets
# its own protocol anyway, so a `[defaults]` table here would only restate the tool.
#
# HARD RULE, checked at load time: this file can only provide **machine paths and fallback
# values**. Writing `provider`, `model`, `thinking`, `etalon` or `repetitions` in [defaults]
# raises an error. Those keys decide what is measured, so they are mandatory in the scenario,
# otherwise the same file would measure something else on another machine.

# Measurable repositories, by logical name. A local path works too, relative to this file; the
# URL saves the trainee from cloning NEON himself, at the price of network access to GitHub. A
# URL is cloned once, at the etalon tag, and every run then clones from that local copy.
[repos]
neon = "https://github.com/AI-for-dev/neon.git"

# The `extension` brick of the scenario cites this repository by its logical name.
[harness]
websearch = "https://github.com/sebaxzero/pi-safe-search"

# Each run executes in its own container, from the image the scenario declares in `[agent] image`.
# The provider key never enters the container: trysquare reads it from your `models.json`, hands
# the container a placeholder, and swaps it on a relay running on this machine. `cpus` and `memory`
# bound one container, so `concurrency` times these two is what the machine has to carry.
[isolation]
backend = "docker"
cpus = 1
memory = "4g"
models = "models.json"
secrets = ".env"
