# The only role of this file is to say where trysquare comes from.
#
# `uv sync` creates `.venv` and writes `uv.lock`, which pins trysquare and all its transitive
# dependencies. Versioning that lock file is what makes a measurement repeatable: trysquare pins
# the measured repo by a tag, but nothing pins trysquare itself, and a harness that does not pin
# itself measures the operator.
[project]
name = "trysquare-starter"
version = "0"
description = "Throwaway environment for replaying the issue1-context scenario"
requires-python = ">=3.12"
dependencies = ["trysquare>=0.8.0"]

# trysquare is published on TestPyPI, its dependencies on PyPI. The named index is declared
# `explicit`, so uv only looks there for the packages that name it as their source: the others come
# from PyPI, and TestPyPI cannot silently supply a namesake dependency.
[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
explicit = true

[tool.uv.sources]
trysquare = { index = "testpypi" }
