# The context levers of module 2.1, measured on issue #1.
#
# Each lever is tried alone against a base, then in a stack. The plan is a grid of five levers
# against `blind`: `exclude` removes three of its ten cells, keeping `blind` only for `thinking`
# and `well_crafted`, and `include` adds two stacks. Nine cells in all.
#
# The playtester skills are measured in their own scenario, `issue1-skill.toml`, with the same
# agent, etalon, protocol and validator. Its cells cannot read `ISSUES.md`, so its base is not
# this one.
#
# Issue #1 was chosen because its hard half is a behaviour ("a side impact flips vx"), and a
# behaviour can be executed and checked mechanically. See the hypothesis.
#
# The criterion is a probe: `materials/provided-probe/probe.test.js`, `node:test` tests dropped in
# a copy of the agent's tree outside the clone. Twelve cases in five columns. The first four place
# a ball already overlapping a brick, call `frame()`, and watch which component of the speed
# flips: the faces of a brick (the criterion), its corner, the exit out of the rectangle after the
# bounce, the seam between two bricks. The fifth is a classic breakout bug the ticket does not ask
# for, tunneling, which records instead of separating.

[scenario]
name = "issue1-context"
title = "The context levers of module 2.1, against the bounce of issue #1"
# Versioned, and written before measuring. It also says that the shape of the probe was chosen
# after a first matrix, whose six runs were invalid and whose diffs were read.
hypothesis = "../hypotheses/issue1-context.md"

[task]
repo = "neon"
# A tag, cloned. Never the working tree: `main` moves on, a classroom fixes issue #1, and
# yesterday's measurements stop comparing with tomorrow's. Issue #1 is open at this tag: the bug
# is in `frame()` and the comment describing the fix is right next to it.
etalon = "etalon-v1"
prompt = "../materials/issue1-simple-prompt.md"

[agent]
provider = "my-provider"
model = "my-model"

# Always declared, never inherited. The operator's `defaultThinkingLevel` once made the `thinking`
# cell identical to the base in every published matrix.
thinking = "off"

# The agent's tools belong to the experiment, not to the machine, so the image is declared here:
# the official pi image (pi, Node, git, python3), by its dated tag and its digest, so it never
# moves. It is also trysquare 0.12.0's default, written out so that a newer trysquare with
# another default does not change what this scenario measures. `docker pull` it once.
image = "docker.io/sbx/pi-image:20261011-358a89d1cda7f47b37a5a4b60b2ce63be4eab818@sha256:17f24a8c99653df1d325f4ce684c349c861b15c513de7337dde7cf54e95f2a13"

[protocol]
# Declared in advance, and never rerun "just to see". Twenty runs per cell; the smoke pass is
# `--repetitions 2`, a value stamped into the name of the output directory so that it is not
# mistaken for the real matrix.
repetitions = 20
concurrency = 5
timeout = 1800
attempts = 5

# --- Levers ----------------------------------------------------------------
#
# Each lever is declared once. A cell of the grid that names one takes its lines, and a cell
# of `include` is named after the levers it takes, in the order they are declared here: a name
# cannot promise a lever the cell does not have.

[presets]
thinking = { thinking = "high" }
# The project convention, as a permanent context file. A control rather than a treatment:
# `AGENTS.md` says nothing about this ticket, so if it moves the criterion, then the criterion
# measures diligence and not the lever the line names.
agents = { context = "../materials/AGENTS.md" }
well_crafted = { prompt = "../materials/issue1-well-crafted-prompt.md" }
add_tests = { harness = ["provided-probe"] }
# No git history, and `ISSUES.md` removed before the agent starts. The history goes after the
# script, so nothing it deleted can be read back with `git show`.
blind = { history = false, setup = "../materials/remove-issues-md.sh" }
# The agent's system prompt replaced by three lines. trysquare writes them to `.pi/SYSTEM.md` in
# the clone, which replaces pi's system prompt entirely; context files and skills are still added
# on top.
system_prompt = { system = "../materials/SYSTEM-minimal.md" }

# --- Cells: one lever at a time, with and without `blind`, then the stacks ----
#
# `nothing / no` is the base: the vague request, no `AGENTS.md`, no reasoning budget, pi's own
# system prompt, the project's history and `ISSUES.md` in reach. What somebody does on day one.

[axes]
lever = ["nothing", "thinking", "agents", "well_crafted", "system_prompt"]
blind = ["no", "blind"]
exclude = [
  { lever = "nothing", blind = "blind" },
  { lever = "agents", blind = "blind" },
  { lever = "system_prompt", blind = "blind" },
]
include = [
  # `agents`, `thinking` and the well crafted ticket, together.
  [
    "agents",
    "well_crafted",
    "thinking",
  ],

  # The cell that asks the opposite question to all the others. Elsewhere context is given and
  # we watch whether the agent finds the case the request does not name; here he is given **the
  # test that judges him**, red, in the tree, and we watch whether he corrects himself.
  #
  # It is read against the stack above, the only cell it differs from by this brick alone, and
  # never against the base, which it differs from by four levers. The verdict column stays taken
  # against the base for every cell, so the useful gap is read in the table, between the two rows.
  #
  # The provided probe is the very file that scores, dropped as is. This cell therefore also reads
  # its tunneling case, which issue #1 does not ask for, and may make it pass where the other cells
  # never see it. That column does not compare from one cell to the next; the first four do, and
  # that is where the lever can be read.
  [
    "agents",
    "add_tests",
    "well_crafted",
    "thinking",
  ],
]

# --- Harness bricks --------------------------------------------------------

# The probe, handed to the `add_tests` cell. `kind = "files"` drops it in the measured tree, at the
# path this table names, and commits it there on the etalon before the agent starts.
#
# The destination path is declared here and not deduced from the name of the source file, because
# it is what decides whether `node --test "game/**/*.test.js"` - the command behind `npm test` -
# picks the probe up. That is a decision of the experiment.
#
# The commit is what makes the injection free in `touched` while keeping a trace of what the agent
# does with it: the `probe_intact` column distinguishes "satisfied" from "rewritten until it
# passed", and without the commit a loosened probe would leave nothing anywhere.
[harness.provided-probe]
kind = "files"

[harness.provided-probe.files]
"game/probe.test.js" = "../materials/provided-probe/probe.test.js"

# --- Validation ------------------------------------------------------------

# `metrics` is a contract. A run whose validator omits one of these names is invalid, rather than
# having the missing key read as "false".
[[validation]]
mode = "script"
command = "../validators/issue1.py"
metrics = [
  # mechanical: did the agent modify at least one file?
  "delivered",
  # process, read in the session: did the agent run `npm test` himself? It says nothing about
  # the state he left the suite in, which this scenario does not measure.
  "suite_run",
  # process too, and the question a cell with a provided probe has to settle before any other:
  # is the test we gave the agent still the one we gave? Loosening the assertion until it passes
  # is the answer that costs nothing, and `bounces()` is not fooled by it - it rewrites its own
  # copy - so this column protects nothing, it tells. **Not applicable in the cells without
  # `add_tests`**, which receive no probe, rather than false: the validator says why.
  "probe_intact",
  # the scope the ticket puts within reach (`game/neon.js` and `game/neon.test.js`), and the list
  # of files touched, which explains a false `in_scope`
  "in_scope",
  "touched",
  # the edge cases issue #1 asks for, counted against the six of the etalon
  "tests_added",
  # the probe, in five columns from a single run. A matrix archived before a column existed has
  # no value for it, and `compare` prints `-` on that side.
  #
  # The first four judge the correction that was asked for, from the coarsest to the finest: the
  # faces of a brick (the criterion), its corner, the exit out of the rectangle after the bounce,
  # and the case where the ball overlaps two bricks of the same seam of the grid.
  "bounce_bricks",
  "bounce_corners",
  "bounce_exit",
  "bounce_neighbors",
  # A latent bug of the repo that issue #1 does not ask anyone to fix: the tunneling of a fast
  # ball. It enters no criterion and changes no verdict.
  "bounce_tunneling",
]

# --- Verdict ---------------------------------------------------------------

[verdict]
# The hard half of the ticket, and the reason this task was chosen: a behaviour the probe executes.
criterion = "bounce_bricks"
reference = { lever = "nothing", blind = "no" }

# **A green suite is deliberately not a validity condition here**, and the scenario does not
# declare `tests` at all. Issue #1 asks for the edge cases "first as red tests, then green". An
# agent who writes the red tests and stops has produced a red suite, which is a *result* for this
# task and not an inability to judge. Filtering those runs out would remove exactly the ones the
# matrix talks about. `delivered` stays: a run that modified no file did not work.
validity = ["delivered"]
