# The context levers of module 2.1, measured on issue #1 instead of issue #2.
#
# The bench took each lever one at a time against a base, then a few stacks. That plan is
# written here as a grid of levers against `blind`, with `exclude` removing the combinations
# nobody wants to read, and `include` adding the stacks: this is not a full cartesian product,
# and writing it as one would invent cells nobody wants to read.
#
# The task changed for a reason. The hard half of issue #2 has no mechanical form - the bench
# approached it with a pattern in the diff, got it wrong twice, and concluded that a judge was
# needed. The hard half of issue #1 is a behaviour ("a side impact flips vx"), and a behaviour is
# executed. See the hypothesis.
#
# The criterion is a probe: `materials/provided-probe/probe.test.js`, `node:test` tests dropped in
# a copy of the agent's tree outside the clone, which place a ball already overlapping a brick,
# call `frame()`, and watch which component of the speed flips. Fifteen cases in six columns: the
# faces of a brick (the criterion), its corner, the exit out of the rectangle after the bounce,
# the seam between two bricks, then two classic breakout bugs the ticket does not ask for -
# tunneling and the paddle - which record instead of separating.

[scenario]
name = "issue1-context"
title = "The context levers of module 2.1, against the bounce of issue #1"
# Versioned. Its incompleteness marker is lifted - the criterion exists - but it now says up front
# that the shape of the probe was chosen after a first matrix, whose six runs were invalid and
# whose diffs were read.
hypothesis = "../hypotheses/issue1-context.md"

[task]
repo = "neon"
# A tag, cloned. Never the working tree: `main` moves on, a classroom fixes issue #1, and
# yesterday's measurements stop comparing with tomorrow's. Issue #1 is open at this tag: the bug
# is in `frame()` and the comment describing the fix is right next to it.
etalon = "etalon-v1"
prompt = "../materials/issue1-simple-prompt.md"

[agent]
provider = "GRICAD"
model = "ARES/DeepSeek-V4.1-Flash"
# provider = "ilaas"
# model = "gemma-4-31b"

# Always declared, never inherited. The operator's `defaultThinkingLevel` once made this cell
# identical to the base in every published matrix.
thinking = "off"

# The agent's tools belong to the experiment, not to the machine, so the image is declared here.
# Built once from trysquare's `image/Dockerfile`: `docker build -t trysquare-agent image/`.
image = "trysquare-agent"

[protocol]
# Declared in advance, and never rerun "just to see". Ten for one session; the smoke pass is
# `--repetitions 2`, a value stamped into the name of the output directory so that it is not
# mistaken for the real matrix.
repetitions = 40
concurrency = 60
timeout = 1800
attempts = 5

# --- Levers ----------------------------------------------------------------
#
# Each lever is declared once. A cell of the grid that names one takes its lines, and a cell
# of `include` is named after the levers it takes, in the order they are declared here: a name
# cannot promise a lever the cell does not have.

[presets]
thinking = { thinking = "high" }
# The project convention, as a permanent context file. A control rather than a treatment:
# `AGENTS.md` says nothing about this ticket, so if it moves the criterion, then the criterion
# measures diligence and not the lever the line names.
agents = { context = "../materials/AGENTS.md" }
well_crafted = { prompt = "../materials/issue1-well-crafted-prompt.md" }
# A skill is loaded through its brick, and the prompt invokes it. The bricks of several levers
# add up: a cell taking `skill` and `add_tests` loads all three.
skill = { prompt = "../materials/issue1-simple-prompt-with-skill.md", harness = ["skills-playtest", "extension"] }
add_tests = { harness = ["provided-probe"] }
# No git history, and `ISSUES.md` removed before the agent starts. The history goes after the
# script, so nothing it deleted can be read back with `git show`.
blind = { history = false, setup = "../materials/remove-issues-md.sh" }
# The agent's system prompt replaced by three lines. This is not what `--system-prompt` does: the
# harness writes `.pi/SYSTEM.md` into the clone, which replaces it entirely, and context files and
# skills keep being added on top.
system_prompt = { system = "../materials/SYSTEM-minimal.md" }

# --- Cells: one lever at a time, with and without the history, then the stacks ----
#
# `nothing / no` is the base: the vague request, no rules file, no reasoning budget, the agent's
# own system prompt, the project's history in reach. What somebody does on day one.

[axes]
lever = ["nothing", "thinking", "agents", "well_crafted", "system_prompt"]
blind = ["no", "blind"]
exclude = [
  { lever = "nothing", blind = "blind" },
  { lever = "agents", blind = "blind" },
  { lever = "system_prompt", blind = "blind" },
]
include = [
  # Every lever that pointed in the right direction, together. The bench called this cell
  # `flash (well crafted)`, and it is one corner of a 2x2; the other two are in
  # `issue1-context-pro.toml`, because the model is a constant of the scenario.
  [
    "agents",
    "well_crafted",
    "thinking",
  ],
  [
    "agents",
    "skill",
    "thinking",
  ],

  # The cells that ask the opposite question to all the others. Elsewhere context is given and
  # we watch whether the agent finds the case the request does not name; here he is given **the
  # test that judges him**, red, in the tree, and we watch whether he corrects himself.
  #
  # Each is read against the same stack without `add_tests`, the only cell it differs from by
  # this brick alone, and never against the base, which it differs from by four things. The
  # verdict column stays taken against the base for every cell; here it is `compare`, or the
  # table, that gives the useful gap.
  #
  # The provided probe is the very file that scores, dropped as is. These cells therefore also
  # read its two latent groups - tunneling and paddle - which issue #1 does not command, and may
  # make them pass where the other cells never see them. Those two columns do not compare from
  # one cell to the next; the first four do, and that is where the lever can be read.
  [
    "agents",
    "add_tests",
    "well_crafted",
    "thinking",
  ],
  [
    "agents",
    "add_tests",
    "skill",
    "thinking",
  ],
]

# The `+rtk` cell of the bench is deliberately absent. `pi-rtk-optimizer` is installed as a package
# under `~/.pi/agent/extensions`, without a git tag to pin, and a harness brick that floats while
# the measured repo is pinned measures the operator. The bench had found no effect from it on this
# repo anyway, and gave the arithmetic: it compacts tool output, and over 617 lines there is
# nothing to compact.

# --- Harness bricks --------------------------------------------------------

# Declared once and cited by name, so that pinning lives in a single place.
#
# Nothing to pin here: the skill is versioned in this repository, so noting the revision of this
# repository next to a matrix pins it. That is what the `+rtk` cell of the bench lacked, and why it
# stayed absent.
[harness.skills-playtest]
kind = "skills"
paths = ["../materials/skills/playtest"]

# The only brick of this scenario whose material addresses the **task** and not the agent library:
# `kind = "files"` drops it in the measured tree, at the path this table names, and commits it
# there on the etalon before the agent starts.
#
# The destination path is declared here and not deduced from the name of the source file, because
# it is what decides whether `node --test "game/**/*.test.js"` - the command behind `npm test` -
# picks the probe up. That is a decision of the experiment.
#
# The commit is what makes the injection free in `touched` while keeping a trace of what the agent
# does with it: the `probe_intact` column distinguishes "satisfied" from "rewritten until it
# passed", and without the commit a loosened probe would leave nothing anywhere.
[harness.provided-probe]
kind = "files"

[harness.provided-probe.files]
"game/probe.test.js" = "../materials/provided-probe/probe.test.js"

[harness.extension]
repo = "websearch"
tag = "master"
load = "extensions"

# --- Validation ------------------------------------------------------------

# `metrics` is a contract. A run whose validator omits one of these names is invalid, rather than
# having the missing key read as "false".
[[validation]]
mode = "script"
command = "../validators/issue1.py"
metrics = [
  # mechanical, and settled
  "delivered",
  # process, read in the session: did the agent run `npm test` himself? Distinct from `tests`,
  # which says in which state he left the repo.
  "suite_run",
  # process too, and the first question a cell with a skill has to settle: did the body of the
  # `SKILL.md` enter the context? pi only puts the name and the description in the system prompt,
  # so a loaded skill is not a skill that was read. False rather than not applicable in the cells
  # that receive no skill: it is a fact about the session. The validator says why.
  "skill_invoked",
  # process again, and the question a cell with a provided probe has to settle before any other:
  # is the test we gave the agent still the one we gave? Loosening the assertion until it passes
  # is the answer that costs nothing, and `bounces()` is not fooled by it - it rewrites its own
  # copy - so this column protects nothing, it tells. **Not applicable in the cells without
  # `add_tests`**, which receive no probe: the validator says why it is "not applicable" here
  # where `skill_invoked` is "false".
  "probe_intact",
  # the scope the ticket puts within reach, and its diagnosis
  "in_scope",
  "touched",
  # the edge cases issue #1 asks for, counted against the six of the etalon
  "tests_added",
  # the probe, in six columns from a single run. **They do not add themselves to the matrices
  # already archived**: `compare` will not join a matrix from before with a matrix from after.
  #
  # The first four judge the correction that was asked for, from the coarsest to the finest: the
  # faces of a brick (the criterion), its corner, the exit out of the rectangle after the bounce,
  # and the case where the ball overlaps two bricks of the same seam of the grid.
  "bounce_bricks",
  "bounce_corners",
  "bounce_exit",
  "bounce_neighbors",
  # A latent bug of the repo that issue #1 does not ask anyone to fix: the tunneling of a fast
  # ball. It enters no criterion and changes no verdict.
  "bounce_tunneling",
]

# --- Verdict ---------------------------------------------------------------

[verdict]
# The hard half of the ticket, and it is for it that this task was chosen: on issue #2 the
# equivalent column carried a star and had to be taken on trust.
criterion = "bounce_bricks"
reference = { lever = "nothing", blind = "no" }

# **`tests` is deliberately not a validity condition here.** Issue #1 asks for the edge cases
# "first as red tests, then green". An agent who writes the red tests and stops has produced a
# red suite, which is a *result* for this task and not an inability to judge. Filtering those
# runs out would remove exactly the ones the matrix talks about. `delivered` stays: a run that
# modified no file did not work, and it passes the tests by construction.
validity = ["delivered"]
