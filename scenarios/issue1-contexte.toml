# Les leviers de contexte du module 2.1, mesurés sur l'issue #1 au lieu de l'issue #2.
#
# Le banc prenait chaque levier un à un contre une base, et ce plan est reproduit ici
# en variantes nommées plutôt qu'en grille : ce n'est pas un produit cartésien, et
# l'écrire comme tel inventerait huit cellules que personne ne veut lire.
#
# La tâche a changé pour une raison. La moitié dure de l'issue #2 n'a pas de forme
# mécanique - le banc l'a approchée par un motif dans le diff, s'est trompé deux fois,
# et a conclu qu'il fallait un juge. La moitié dure de l'issue #1 est un comportement
# (« un choc latéral inverse vx »), et un comportement s'exécute. Voir l'hypothèse.
#
# Le critère est une sonde : `briques/sonde-fournie/sonde.test.js`, des tests `node:test` déposés
# dans une copie de l'arbre de l'agent hors du clone, qui posent une balle déjà en
# recouvrement avec une brique, appellent `frame()`, et regardent quelle composante de
# vitesse s'inverse. Quinze cas en six colonnes : les faces d'une brique (le critère), son
# coin, la sortie du rectangle après le rebond, la couture entre deux briques, puis deux
# bugs classiques du casse-briques que le ticket ne demande pas - le tunneling et la
# raquette - qui constatent au lieu de départager.

[scenario]
name = "issue1-contexte"
title = "Les leviers de contexte du module 2.1, contre le rebond de l'issue #1"
# Versionnée. Son marqueur d'incomplétude est levé - le critère existe - mais elle dit
# désormais en tête que la forme de la sonde a été choisie après une première matrice,
# dont les six exécutions étaient invalides et dont les diffs ont été lus.
hypothesis = "../hypotheses/issue1-contexte.md"

[task]
repo = "neon"
# Un tag, cloné. Jamais l'arbre de travail : `main` avance, une salle corrige
# l'issue #1, et les mesures d'hier cessent de se comparer à celles de demain.
# L'issue #1 est ouverte à ce tag : le bug est dans `frame()` et le commentaire qui
# décrit la correction est juste à côté.
etalon = "etalon-v1"
prompt = "../briques/issue1-simple-prompt.md"

[agent]
# provider = "opencode-go"
# model = "qwen3.8-flash"
# model = "deepseek-v4-flash"

provider = "test-ilaas"
model = "gemma-4-31b_alt"

# provider = "GRICAD"
# model = "ARES/Qwen3.8-27B"
# Toujours déclaré, jamais hérité. Le `defaultThinkingLevel` de l'opérateur a rendu
# une fois cette cellule identique à la base dans toutes les matrices publiées.
thinking = "off"

[protocol]
# Déclarées à l'avance, et jamais relancées « pour voir ». Dix pour une séance ; la
# passe de fumée est `--repetitions 2`, valeur estampillée dans le nom du répertoire
# de sortie pour qu'on ne la confonde pas avec la vraie matrice.
repetitions = 20
concurrency = 30
timeout = 1800
attempts = 5

# --- Cellules : un levier à la fois, puis la pile --------------------------
#
# `rien` est la base et ne déclare aucun delta, ce qui en fait une cellule de la
# matrice plutôt qu'une septième chose posée à côté.

[variants.nothing]
# Ce que fait quelqu'un le premier jour : la demande vague, pas de fichier de
# règles, pas de budget de raisonnement, le prompt système de l'agent.

[variants."+thinking"]
thinking = "low"

[variants."+agents"]
# La convention de projet, en fichier de contexte permanent. Un témoin plutôt qu'un
# traitement : `AGENTS.md` ne dit rien de ce ticket, donc s'il déplace le critère,
# c'est que le critère mesure de la diligence et non le levier que la ligne nomme.
context = "../briques/AGENTS.md"

[variants."+well_crafted"]
# Périmètre, critère d'arrêt, et un pointeur vers l'issue #1 de `ISSUES.md`. Il ne
# répète *pas* le mécanisme du rebond par face, alors que le ticket du dépôt le
# détaille. Cette retenue est tout le sujet : voir `../briques/README.md`.
prompt = "../briques/issue1-well-crafted-prompt.md"

[variants."-system_prompt"]
# Le prompt système de l'agent remplacé par trois lignes. Ce n'est pas ce que fait
# `--system-prompt` : le harnais écrit `.pi/SYSTEM.md` dans le clone, ce qui le
# remplace entièrement, et les fichiers de contexte et les skills continuent d'être
# ajoutés par-dessus.
system = "../briques/SYSTEM-minimal.md"

[variants."+agents+well_crafted"]
# Tous les leviers qui pointaient dans le bon sens, ensemble. Le banc appelait cette
# cellule `flash (soigné)`, et c'est un coin du 2×2 ; les deux autres sont dans
# `issue1-contexte-pro.toml`, parce que le modèle est une constante de scénario.
prompt = "../briques/issue1-well-crafted-prompt.md"
context = "../briques/AGENTS.md"
thinking = "low"

[variants."+agents+skill"]
prompt = "../briques/issue1-simple-prompt-with-skill.md"
context = "../briques/AGENTS.md"
thinking = "low"
harness = ["skills-playtest", "extension"]

# La cellule qui pose la question inverse de toutes les autres. Ailleurs on donne du
# contexte et on regarde si l'agent trouve le cas que la demande ne nomme pas ; ici on lui
# donne **le test qui le juge**, rouge, dans l'arbre, et on regarde s'il se corrige.
#
# Elle se lit contre `pile soignée`, la seule cellule dont elle ne diffère que par cette
# brique - jamais contre `rien`, qui en diffère par quatre choses. La colonne de verdict de
# la matrice reste prise contre `rien` pour toutes les cellules ; c'est `compare` ou la
# table qui donne l'écart utile ici.
#
# La sonde fournie est le fichier même qui note, déposé tel quel. Cette cellule lit donc aussi
# ses deux groupes latents - tunneling et raquette - que l'issue #1 ne commande pas, et peut les
# faire passer là où les autres cellules ne les voient jamais. Ces deux colonnes ne se comparent
# donc pas d'une cellule à l'autre ; les quatre premières, si, et c'est sur elles que le levier
# se lit.
[variants."+agents+add_tests+well_crafted"]
prompt = "../briques/issue1-well-crafted-prompt.md"
context = "../briques/AGENTS.md"
thinking = "low"
harness = ["sonde-fournie"]

[variants."+agents+add_tests+skill"]
prompt = "../briques/issue1-simple-prompt-with-skill.md"
context = "../briques/AGENTS.md"
thinking = "low"
harness = ["skills-playtest", "extension", "sonde-fournie"]


# La cellule `+rtk` du banc est délibérément absente. `pi-rtk-optimizer` est installé
# en paquet sous `~/.pi/agent/extensions`, sans tag git à épingler, et une brique de
# harnais qui flotte pendant que le dépôt mesuré est épinglé mesure l'opérateur. Le
# banc n'y avait de toute façon trouvé aucun effet sur ce dépôt, et en donnait
# l'arithmétique : elle compacte les sorties d'outils, et sur 617 lignes il n'y a
# rien à compacter.

# --- Briques de harnais ---------------------------------------------------

# Déclarée une fois et citée par nom, pour que l'épinglage vive à un seul endroit.
#
# **Le nom `skills` n'est pas décoratif** : trysquare range les `paths` d'une brique
# dans les compétences si et seulement si la brique s'appelle `skills`, et dans les
# définitions de sous-agents sinon. Une brique nommée autrement injecterait ce
# répertoire comme un agent, chargerait la garde des sous-agents avec lui, et
# échouerait sur le contrôle de modèle - en mesurant, entre-temps, autre chose que ce
# que cette ligne dit.
#
# Rien à épingler ici : la compétence est versionnée dans ce dépôt, dont `mesurer.sh`
# enregistre la révision à chaque mesure. C'est ce qui manquait à la cellule `+rtk` du
# banc, restée absente pour cette raison.
[harness.skills-playtest]
kind = "skills"
paths = ["../briques/skills/playtest"]

# La seule brique de ce scénario dont le matériau s'adresse à la **tâche** et non à la
# bibliothèque d'agent : `kind = "files"` la dépose dans l'arbre mesuré, au chemin que cette
# table nomme, et l'y commite sur l'étalon avant que l'agent démarre.
#
# Le chemin de destination est déclaré ici et pas déduit du nom du fichier source, parce que
# c'est lui qui décide si `node --test "game/**/*.test.js"` - la commande de `npm test` -
# ramasse la sonde. C'est une décision de l'expérience.
#
# Le commit est ce qui rend l'injection gratuite dans `touched` tout en gardant une trace de
# ce que l'agent en fait : la colonne `sonde_intacte` distingue « satisfaite » de « réécrite
# jusqu'à ce qu'elle passe », et sans le commit une sonde desserrée ne laisserait rien nulle
# part.
[harness.sonde-fournie]
kind = "files"

[harness.sonde-fournie.files]
"game/sonde.test.js" = "../briques/sonde-fournie/sonde.test.js"

[harness.extension]
repo = "websearch"
tag = "master"
load = "extensions"

# --- Validation -----------------------------------------------------------

# `metrics` est un contrat. Une exécution dont le validateur omet l'un de ces noms est
# invalide, plutôt que de voir la clé manquante lue comme « faux ».
#
# Les sept premières sont mécaniques et reprises telles quelles. Les quatre dernières
# sont ce que ce scénario existe pour mesurer.
[[validation]]
mode = "script"
command = "../validateurs/issue1.py"
metrics = [
  # mécaniques, et réglées
  "delivered",
  # procédé, lu dans la session : l'agent a-t-il lancé `npm test` lui-même ? Distincte
  # de `tests`, qui dit dans quel état il a laissé le dépôt.
  "suite_lancee",
  # procédé aussi, et la première question qu'une cellule à compétence doit trancher : le
  # corps du `SKILL.md` est-il entré dans le contexte ? pi ne met que le nom et la
  # description dans le prompt système, donc une compétence chargée n'est pas une
  # compétence lue.
  #
  # Les cellules de cette matrice s'y répartissent en trois, et pas en deux :
  #
  # - `+skill-tie-3` et `+sonde+skill` chargent la brique par son nom, donc l'agent doit
  #   aller lire le fichier et peut ne pas le faire. C'est là que la colonne mesure quelque
  #   chose : 3 sur 5 dans la matrice du 3 août.
  # - les deux cellules `-force` mettent `/skill:tie-cases-3` dans le prompt, que pi
  #   développe côté client : le corps est collé dans le premier message, l'agent n'a plus
  #   rien à lire, et la colonne est vraie par construction. C'est voulu - c'est ce que
  #   `-force` veut dire - et l'écart avec la cellule précédente est l'effet mesuré.
  # - les autres n'en reçoivent aucune, et la colonne y est **fausse** plutôt que sans
  #   objet : c'est un fait sur la session, vrai là aussi. Le validateur dit pourquoi.
  "skill_invoque",
  # procédé encore, et la question qu'une cellule à sonde fournie doit trancher avant
  # toute autre : le test qu'on a donné à l'agent est-il encore celui qu'on a donné ?
  # Desserrer l'assertion jusqu'à ce qu'elle passe est la réponse qui ne coûte rien, et
  # `rebonds()` ne s'y laisse pas prendre - il réécrit sa propre copie - donc cette colonne
  # ne protège rien, elle raconte. **Sans objet dans les sept autres cellules**, qui ne
  # reçoivent aucune sonde : le validateur dit pourquoi c'est « sans objet » ici là où
  # `skill_invoque` est « faux ».
  "sonde_intacte",
  # le périmètre que le ticket met à portée, et son diagnostic
  "in_scope",
  "touched",
  # les cas limites que l'issue #1 demande, comptés contre les six de l'étalon
  "tests_ajoutes",
  # la sonde, en six colonnes d'une seule exécution. Une septième jouait les murs du champ ;
  # elle est retirée, parce qu'ils rebondissent déjà à l'étalon et qu'elle était donc verte
  # partout.
  #
  # **Les six ne s'ajoutent pas aux matrices déjà archivées.** `results/…_n10` et
  # `results/…_n20` ont été mesurées avec huit métriques ; `compare` ne joindra plus une
  # matrice d'avant avec une matrice d'après, et il a raison, ce ne sont pas les mêmes
  # mesures. Relancer la matrice est le prix de l'élargissement.
  #
  # Les quatre premières jugent la correction demandée, de la plus grossière à la plus fine :
  # les faces d'une brique (le critère), son coin, la sortie du rectangle après le rebond, et
  # le cas où la balle recouvre deux briques d'une même couture de la grille.
  "rebond_briques",
  "rebond_angles",
  "rebond_sortie",
  "rebond_voisines",
  # Les deux dernières sont des bugs latents du dépôt que l'issue #1 ne demande pas de
  # corriger : le tunneling d'une balle rapide, et trois défauts de la raquette. Elles seront
  # **noires de bout en bout**, ce qui est l'inverse du défaut ayant fait retirer la colonne
  # des murs, et elles sont gardées quand même : le validateur dit pourquoi. Elles n'entrent
  # dans aucun critère et ne changent aucun verdict.
  "rebond_traversee",
  # "in_scope",
  # "tests",
  # "api_stable",
  # "touched",
  # "overflow",
  # "issues",
  # le critère et ses deux moitiés : `bounce` est le plancher (la balle est déviée),
  # `par_face` la moitié dure (le bon axe s'inverse).
  # "bounce",
  # "par_face",
  # une exigence d'obéissance du ticket, pas le critère : voir le validateur.
  # "rouge_dabord",
]

# --- Verdict --------------------------------------------------------------

[verdict]
# La moitié dure du ticket, et c'est pour elle que cette tâche a été choisie : sur
# l'issue #2 la colonne équivalente portait une étoile et devait être crue.
criterion = "rebond_briques"
reference = "nothing"

# **`tests` n'est délibérément pas une condition de validité ici**, et la matrice 2x3
# de trysquare est un mauvais modèle sur ce point.
#
# L'issue #1 demande les cas limites « d'abord en tests rouges, puis verts ». Un agent
# qui écrit les tests rouges et s'arrête a produit une suite rouge, ce qui est un
# *résultat* pour cette tâche et non une impossibilité de juger. Filtrer ces
# exécutions supprimerait exactement celles dont la matrice parle. `delivered` reste :
# une exécution qui n'a modifié aucun fichier n'a pas travaillé, et elle passe les
# tests par construction.
#
# La règle générale, apprise sur le scénario de la note d'impact : une condition de
# validité doit correspondre à la tâche, et aucune condition n'est juste pour toutes.
validity = ["delivered"]
